# build context는 repo 루트(..). 모든 서비스가 루트 Dockerfile 하나를 쓰고 SERVICE 인자로 어느 앱인지 정한다.
# 서비스 간엔 컨테이너명(redis/postgres/rabbitmq…)으로 통신.
# 휘발성 데이터 원칙에 따라 볼륨은 두지 않는다(컨테이너 내리면 데이터 소멸).
name: gachamind

services:
  # ── 엣지: 브라우저가 직접 접근 → 호스트 포트 공개 ──
  web:
    build: { context: .., args: { SERVICE: web } }
    image: gachamind/web:local
    ports: ["3000:3000"]
    environment:
      MATCHMAKING_URL: http://matchmaking:4000
      USER_URL: http://user:4010
    depends_on: [matchmaking, user]

  game-session-1:
    build: { context: .., args: { SERVICE: game-session } }
    image: gachamind/game-session:local
    ports: ["4001:4001"]
    environment:
      PORT: "4001"
      ADVERTISE_HOST: game-session-1 # gs-gateway 가 이 샤드에 닿는 주소(compose 네트워크 안의 컨테이너명)
      MATCHMAKING_URL: http://matchmaking:4000
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: dev-secret # user 가 서명한 세션 토큰을 검증한다. user 와 같은 값이어야 한다
    depends_on: [redis, rabbitmq]

  game-session-2:
    # game-session-1이 빌드한 이미지를 그대로 쓴다(replica는 env만 다르다).
    image: gachamind/game-session:local
    ports: ["4002:4002"]
    environment:
      PORT: "4002"
      ADVERTISE_HOST: game-session-2
      MATCHMAKING_URL: http://matchmaking:4000
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: dev-secret # user 가 서명한 세션 토큰을 검증한다. user 와 같은 값이어야 한다
    depends_on: [redis, rabbitmq]

  # AWS 에선 ALB 의 /gs/* 가 전부 여기로 온다. 로컬은 브라우저가 샤드 포트로 직접 붙어서 안 쓰지만,
  # 같은 모양으로 띄워 둔다(ws://localhost:4100/gs/4001 로 붙으면 game-session-1 로 이어 준다).
  gs-gateway:
    build: { context: .., args: { SERVICE: gs-gateway } }
    image: gachamind/gs-gateway:local
    ports: ["4100:4100"]
    environment:
      PORT: "4100"
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  # ── 내부: web/서비스만 호출 → 호스트 포트 불필요 ──
  matchmaking:
    build: { context: .., args: { SERVICE: matchmaking } }
    image: gachamind/matchmaking:local
    environment:
      PORT: "4000"
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  user:
    build: { context: .., args: { SERVICE: user } }
    image: gachamind/user:local
    environment:
      PORT: "4010"
      DATABASE_URL: postgresql://gachamind:gachamind@postgres:5432/gachamind
      JWT_SECRET: dev-secret
    depends_on: [postgres]

  results-worker:
    build: { context: .., args: { SERVICE: results-worker } }
    image: gachamind/results-worker:local
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      DATABASE_URL: postgresql://gachamind:gachamind@postgres:5432/gachamind
    depends_on: [rabbitmq, postgres]

  # ── 인프라 (공식 이미지) ──
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: gachamind
      POSTGRES_PASSWORD: gachamind
      POSTGRES_DB: gachamind

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"] # 5672=AMQP, 15672=관리 UI
